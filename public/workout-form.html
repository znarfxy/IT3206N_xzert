<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xzert · Add Workout</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span>xzert</div>
      <nav>
        <a href="index.html"><span class="icon">⌂</span>Dashboard</a>
        <a href="workouts.html"><span class="icon">≣</span>Workouts</a>
        <a href="workout-form.html" class="active"><span class="icon">＋</span>Add Workout</a>
      </nav>
      <div class="cta">
        <p>Log every session and watch your consistency add up.</p>
        <a href="workout-form.html" class="btn btn-primary btn-sm" style="width:100%; text-align:center;">Log Workout</a>
      </div>
    </aside>

    <main class="main">
      <div class="container">
        <h1 id="form-title">Log a <span class="accent">Workout</span></h1>
        <p class="subtitle">Fill in the details below.</p>

        <div class="form-card">
          <div class="error-banner" id="error-banner"></div>
          <form id="workout-form">
            <input type="hidden" id="workout-id" />

            <div class="form-group">
              <label for="exercise">Exercise Name</label>
              <input type="text" id="exercise" placeholder="e.g. Bench Press" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                  <option value="">Select category</option>
                  <option value="Cardio">Cardio</option>
                  <option value="Strength">Strength</option>
                  <option value="Flexibility">Flexibility</option>
                  <option value="Sports">Sports</option>
                </select>
              </div>
              <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="duration">Duration (minutes)</label>
                <input type="number" id="duration" min="1" placeholder="30" required />
              </div>
              <div class="form-group">
                <label for="sets">Sets</label>
                <input type="number" id="sets" min="0" placeholder="Optional" />
              </div>
            </div>

            <div class="form-group">
              <label for="reps">Reps</label>
              <input type="number" id="reps" min="0" placeholder="Optional" />
            </div>

            <div class="form-group">
              <label for="notes">Notes</label>
              <textarea id="notes" placeholder="How did it feel? Anything to remember for next time?"></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submit-btn">Save Workout</button>
              <a href="workouts.html" class="btn btn-ghost">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
